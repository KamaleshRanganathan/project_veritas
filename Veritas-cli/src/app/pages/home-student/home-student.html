<div class="outer-container">
  <nav class="vs-navbar">
    <div class="vs-navbar-left">
      <div class="vs-brand">
        <div class="vs-navbar-logo">V</div>
        <span class="vs-navbar-name">Veritas</span>
      </div>
      <div class="vs-navigation">
        <a class="vs-navbar-link active" href="/home-student">Dashboard</a>
        <a class="vs-navbar-link" href="/home-student">Teams</a>
        <a class="vs-navbar-link" href="/home-student">Settings</a>
      </div>
    </div>
    <div class="vs-navbar-right">
      <div class="vs-user-info">
        <div class="vs-user-avatar">SD</div>
        <span>Student</span>
      </div>
      <button class="vs-navbar-logout" (click)="logout()">Logout</button>
    </div>
  </nav>

  <div class="content-container">
    <div class="join-team-container">
      <h2>Join a New Team</h2>
      <form [formGroup]="joinTeamForm" (ngSubmit)="onJoinTeam()">
        <div class="form-group">
          <label for="teamCode">Team Code:</label>
          <input type="text" id="teamCode" formControlName="teamCode" required>
        </div>
        <button type="submit" class="submit-btn" [disabled]="!joinTeamForm.valid">Join Team</button>
      </form>
    </div>

    <hr>

    <h2>Your Teams</h2>
    <div *ngIf="groups.length > 0; else noTeams">
      <div *ngFor="let group of groups" class="team-card">
        <h3>{{ group.name }}</h3>
        <p>Code: {{ group.code }}</p>
        <button (click)="selectTeamForUpload(group)">Upload Work</button>
      </div>
    </div>
    <ng-template #noTeams>
      <p>You are not enrolled in any teams yet.</p>
    </ng-template>

    <div *ngIf="selectedTeam" class="submission-form">
      <h3>Upload work for {{ selectedTeam.name }}</h3>
      <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="docFile">Upload File:</label>
          <input type="file" id="docFile" (change)="onFileChange($event)" required>
          <div class="file-info">Supported formats: .txt</div>
        </div>
        <button type="submit" class="submit-btn" [disabled]="!uploadForm.valid">Submit</button>
        <button type="button" (click)="selectedTeam = null">Cancel</button>
      </form>
    </div>

  </div>
</div>
